limit_req_zone $binary_remote_addr zone=practicum:10m rate=5r/s;
server {
    listen 443 ssl;
    server_name _;
    ssl_certificate /etc/iot/certificaten/server.crt;
    ssl_certificate_key /etc/iot/certificaten/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    client_max_body_size 64k;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
    location / {
        limit_req zone=practicum burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
    }
}
